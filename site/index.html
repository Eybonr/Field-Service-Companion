<!DOCTYPE html>

      darkMode: 'class',
      theme: {
        extend: {

          colors: {
            brand: {
              50: '#effaf8',

              700: '#115e59',

  <style>
    html, body { font-family: 'Inter', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
    .safe-pb { padding-bottom: calc(5.5rem + env(safe-area-inset-bottom, 0px)); }
    .bottom-nav-safe { padding-bottom: calc(0.5rem + env(safe-area-inset-bottom, 0px)); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    @keyframes slideUp {
      from { transform: translateY(16px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .animate-slide-up { animation: slideUp 0.22s ease-out forwards; }

    /* Media always scales to fit its container */
    img, video, canvas, svg, iframe, embed, object { max-width: 100%; }
    img, video { height: auto; }

    /* ===================================================================
       Phone-only refinements (below Tailwind's `sm` breakpoint, 640px).
       Larger screens keep the existing layout untouched.
       =================================================================== */
    @media (max-width: 639px) {
      html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
      body { font-size: 16px; overflow-x: clip; }

      /* --- Readable body text: at least 16px --- */
      body #mainContent .text-xs,
      body #mainContent .text-sm,
      body #modalBody .text-xs,
      body #modalBody .text-sm,
      body #toast { font-size: 1rem; line-height: 1.5rem; }
      /* Small pills/badges and eyebrow labels stay compact but legible */
      body #mainContent [class*="text-[10px]"],
      body #mainContent [class*="text-[11px]"],
      body #modalBody [class*="text-[10px]"],
      body #modalBody [class*="text-[11px]"] { font-size: 0.8125rem; line-height: 1.25rem; }
      body #mainContent h2.text-xs,
      body #modalBody h4.text-xs,
      body #modalBody div.uppercase.text-xs { font-size: 0.875rem; line-height: 1.25rem; }

      /* Form fields at 16px also stop iOS from zooming in on focus */
      body input, body select, body textarea { font-size: 16px !important; }

      /* --- Tap targets: at least 44 x 44px --- */
      body button,
      body a[href],
      body select,
      body input:not([type="hidden"]):not([type="file"]),
      body #modalBody label.cursor-pointer { min-height: 44px; min-width: 44px; }
      body #mainContent a[href],
      body #mainContent button,
      body #modalBody button,
      body #modalBody label.cursor-pointer { display: inline-flex; align-items: center; justify-content: center; }
      body #modalBody button.w-full,
      body #modalBody label.cursor-pointer { display: flex; }
      body #themeToggleBtn,
      body #backupBtn,
      body #modalCloseBtn { width: 44px; height: 44px; }
      body .filter-pill { font-size: 0.9375rem; padding-left: 1rem; padding-right: 1rem; }
      body #searchInput { min-height: 48px; }

      /* Bottom tab bar: full-height targets, labels sized to fit 3 columns */
      body nav .nav-btn { min-height: 56px; font-size: 0.8125rem; padding: 0 0.25rem; text-align: center; line-height: 1.1; }

      /* Header scrolls away on phones so content isn't squeezed by a tall sticky bar */
      body #app > header { position: relative; }

      /* --- Prevent sideways scrolling --- */
      body #mainContent,
      body #modalBody { overflow-wrap: anywhere; word-break: break-word; }
      body #mainContent .flex > *:not([class*="min-w-["]),
      body #modalBody .flex > *:not([class*="min-w-["]) { min-width: 0; }
      body #mainContent button.shrink-0,
      body #mainContent .flex > a[href]:not([class*="min-w-["]),
      body #mainContent .flex > button:not([class*="min-w-["]),
      body #modalBody .flex > button:not([class*="min-w-["]) { min-width: 44px; }
      body #toast { max-width: calc(100vw - 2rem); width: max-content; text-align: center; }

      /* Keep the add button clear of the tab bar on notched phones */
      body #fabAddBtn { bottom: calc(6rem + env(safe-area-inset-bottom, 0px)); min-height: 48px; font-size: 1rem; }
      body .safe-pb { padding-bottom: calc(8.5rem + env(safe-area-inset-bottom, 0px)); }

      /* Modal fits the visible viewport even with mobile browser chrome */
      body #modalCard { max-height: 90vh; max-height: 90dvh; }
    }
  </style>
</head>

    function loadState() {
      try {

          const parsed = JSON.parse(raw);
          return {
            theme: parsed.theme || "light",
            activeTab: parsed.activeTab || "students",
            students: Array.isArray(parsed.students) ? parsed.students : DEFAULT_DATA.students,
            returnVisits: Array.isArray(parsed.returnVisits) ? parsed.returnVisits : DEFAULT_DATA.returnVisits
          };
        }
      } catch (e) {
        // Fallback to in-memory default if storage is restricted
      }
      return JSON.parse(JSON.stringify(DEFAULT_DATA));
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        window.dispatchEvent(new Event("records-saved"));

      }

    // =========================================================================
    // 3. HELPERS
    // =========================================================================
    function getBook(bookId) {
      return JW_STUDY_BOOKS.find(b => b.id === bookId) || JW_STUDY_BOOKS[0];
    }

    function getLessonTitle(book, lessonNum) {
      if (book.lessons && book.lessons[lessonNum - 1]) {
        return book.lessons[lessonNum - 1];
      }
      return `${book.unitLabel} ${lessonNum}`;
    }

    function escapeHTML(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function buildGoogleMapsUrl(googleAddress, fallbackAddress) {
      const val = (googleAddress || "").trim();
      if (val && /^https?:\/\//i.test(val)) {
        return val;
      }
      const query = val || (fallbackAddress || "").trim();
      if (!query) return "";
      return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(query)}`;
    }

    function isDueOrOverdue(dateStr) {
      if (!dateStr) return false;
      return dateStr <= todayISO();
    }

    function isStudentDue(student) {
      if (student.studyReminder && Number.isFinite(Date.parse(student.studyReminder))) return Date.parse(student.studyReminder) <= Date.now();
      if (!student.lastStudied) return true;
      const last = new Date(student.lastStudied + "T00:00:00");
      const diffDays = Math.floor((Date.now() - last.getTime()) / 86400000);
      return diffDays >= 7;
    }

    function formatShortDate(dateStr) {
      if (!dateStr) return "Not set";
      const d = new Date(dateStr + "T00:00:00");
      if (isNaN(d.getTime())) return dateStr;
      return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
    }

    function getInitials(name) {
      const parts = String(name || "?").trim().split(/\s+/);
      if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
      return (parts[0][0] || "?").toUpperCase();
    }

    let toastTimer = null;
    function showToast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.remove("opacity-0");
      el.classList.add("opacity-100");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        el.classList.remove("opacity-100");
        el.classList.add("opacity-0");
      }, 2400);
    }

      const searchWrap = document.getElementById("searchBarWrap");
      const lffPill = document.querySelector('[data-filter="lff"]');

      if (state.activeTab === "books") {
        fab.classList.add("hidden");
        searchWrap.classList.add("hidden");
      } else {
        fab.classList.remove("hidden");
        searchWrap.classList.remove("hidden");

          : "filter-pill px-3 py-1 rounded-full text-xs font-semibold bg-white/15 text-white hover:bg-white/25 transition shrink-0";
      });

      document.getElementById("statStudents").textContent = state.students.length;

      const book = getBook(s.bookId);
      const historyHtml = (s.history || []).slice().reverse().map(h => `
        <div class="p-2.5 rounded-xl bg-slate-50 dark:bg-slate-800/70 border border-slate-100 dark:border-slate-800 text-xs">
          <div class="flex items-center justify-between font-semibold text-slate-700 dark:text-slate-200">

            <span class="text-slate-400">${formatShortDate(h.date)}</span>
          </div>
          ${h.note ? `<p class="text-slate-500 dark:text-slate-400 mt-1">${escapeHTML(h.note)}</p>` : ''}
        </div>
      `).join("") || `<p class="text-xs text-slate-400 italic">No past sessions logged yet.</p>`;

      openModal(`Study Log — ${s.name}`, `
        <form id="logSessionForm" class="space-y-3">
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">${escapeHTML(book.unitLabel)} Covered</label>
              <input name="lesson" type="number" min="1" max="${s.totalLessons}" value="${s.currentLesson}" class="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm" />

            </div>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Session Notes</label>
            <textarea name="note" rows="2" placeholder="Key points discussed, next lesson to prepare..." class="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm"></textarea>
          </div>
          <button type="submit" class="w-full py-2.5 rounded-xl bg-brand-600 hover:bg-brand-700 text-white text-sm font-semibold transition">Save Session</button>
        </form>
        <div class="pt-3 border-t border-slate-200 dark:border-slate-800 space-y-2">
          <div class="text-xs font-bold uppercase tracking-wider text-slate-500">Recent History</div>
          <div class="space-y-2 max-h-44 overflow-y-auto">${historyHtml}</div>
        </div>
      `);

      document.getElementById("logSessionForm").addEventListener("submit", e => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const lesson = Math.min(s.totalLessons, Math.max(1, Number(fd.get("lesson")) || s.currentLesson));
        const date = fd.get("date") || todayISO();
        const note = fd.get("note").trim();
        s.currentLesson = lesson;
        s.lastStudied = date;
        if (s.studyReminder?.slice(0, 10) <= date) s.studyReminder = "";
        s.history = s.history || [];
        s.history.push({ date, lesson, note });
        saveState();
        closeModal();
        render();
        showToast("Study session logged");
      });
    }

    function openBackupModal() {
      openModal("Local Phone Data & Backup", `
        <div class="space-y-4">
          <p class="text-xs text-slate-600 dark:text-slate-300 leading-relaxed">
            Your Bible students and return visits are saved locally in your phone's browser storage. Export a JSON backup anytime to move data or keep a copy.
          </p>
          <div class="grid grid-cols-1 gap-2.5">
            <button type="button" id="exportJsonBtn" class="w-full py-2.5 px-4 rounded-xl bg-brand-600 hover:bg-brand-700 text-white text-sm font-semibold transition">Export Backup (.json)</button>
            <label class="w-full py-2.5 px-4 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-800 dark:text-slate-200 text-sm font-semibold text-center cursor-pointer transition">
              Import Backup (.json)
              <input id="importJsonInput" type="file" accept=".json,application/json" class="hidden" />
            </label>
            <button type="button" id="clearSampleBtn" class="w-full py-2.5 px-4 rounded-xl bg-rose-50 dark:bg-rose-950/40 text-rose-600 dark:text-rose-400 text-xs font-semibold hover:bg-rose-100 transition">Clear All Entries (Start Fresh)</button>
          </div>
        </div>
      `);

      document.getElementById("exportJsonBtn").addEventListener("click", () => {
        const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `field-service-backup-${todayISO()}.json`;
        a.click();
        URL.revokeObjectURL(url);
        showToast("Backup downloaded");
      });

      document.getElementById("importJsonInput").addEventListener("change", e => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = ev => {
          try {
            const parsed = JSON.parse(ev.target.result);
            if (Array.isArray(parsed.students) && Array.isArray(parsed.returnVisits)) {
              state.students = parsed.students;
              state.returnVisits = parsed.returnVisits;
              saveState();
              closeModal();
              render();
              showToast("Backup restored");
            } else {
              showToast("Invalid backup format");
            }
          } catch (err) {
            showToast("Could not read JSON file");
          }
        };
        reader.readAsText(file);
      });

      document.getElementById("clearSampleBtn").addEventListener("click", () => {
        state.students = [];
        state.returnVisits = [];
        saveState();
        closeModal();
        render();
        showToast("All entries cleared");
      });
    }

    // =========================================================================
    // 7. EVENT LISTENERS
    // =========================================================================
    document.getElementById("themeToggleBtn").addEventListener("click", () => {
      state.theme = state.theme === "dark" ? "light" : "dark";
      saveState();
      applyTheme();
    });

    document.getElementById("backupBtn").addEventListener("click", openBackupModal);
    document.getElementById("modalCloseBtn").addEventListener("click", closeModal);
    document.getElementById("modalBackdrop").addEventListener("click", e => {
      if (e.target.id === "modalBackdrop") closeModal();
    });

    document.querySelectorAll(".nav-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        state.activeTab = btn.dataset.tab;
        activeFilter = "all";
        saveState();
        render();
      });
    });

    document.getElementById("searchInput").addEventListener("input", e => {
      searchQuery = e.target.value;
      render();
    });

    document.querySelectorAll(".filter-pill").forEach(pill => {
      pill.addEventListener("click", () => {
        activeFilter = pill.dataset.filter;
        render();
      });
    });

    document.getElementById("fabAddBtn").addEventListener("click", () => {
      if (state.activeTab === "students") openStudentModal();
      else if (state.activeTab === "visits") openVisitModal();
    });

    document.getElementById("mainContent").addEventListener("click", e => {
      const btn = e.target.closest("[data-action]");
      if (!btn) return;
      const action = btn.dataset.action;
      const id = btn.dataset.id;

      if (action === "edit-student") {
        openStudentModal(id);
      } else if (action === "advance-lesson") {
        const s = state.students.find(x => x.id === id);
        if (s) {
          if (s.currentLesson < s.totalLessons) {
            s.currentLesson += 1;
            s.lastStudied = todayISO();
            if (s.studyReminder?.slice(0, 10) <= todayISO()) s.studyReminder = "";
            s.history = s.history || [];
            s.history.push({ date: todayISO(), lesson: s.currentLesson, note: "Advanced +1" });
            saveState();
            render();
            showToast(`Moved to ${getBook(s.bookId).unitLabel} ${s.currentLesson}`);
          } else {
            showToast("Already at final lesson!");
          }
        }
      } else if (action === "log-study") {
        openLogSessionModal(id);
      } else if (action === "edit-visit") {
        openVisitModal(id);
      } else if (action === "mark-visited") {
        const v = state.returnVisits.find(x => x.id === id);
        if (v) {
          v.lastVisit = todayISO();
          v.nextVisit = addDaysISO(7);
          saveState();
          render();
          showToast("Visit logged · Next in 7 days");
        }
      } else if (action === "promote-visit") {
        const v = state.returnVisits.find(x => x.id === id);
        if (v) {
          openStudentModal(null, {
            _fromVisitId: v.id,
            name: v.name,
            phone: v.phone,
            address: v.address,
            googleAddress: v.googleAddress,
            bookId: "lff",
            customBookName: "",
            currentLesson: 1,
            totalLessons: 60,
            schedule: "",
            lastStudied: todayISO(),
            notes: v.questionLeft ? `Initial interest question: ${v.questionLeft}` : v.notes
          });
        }
      } else if (action === "browse-lff") {
        openLffBrowserModal();
      }
    });

    // Init
    applyTheme();
    render();

    // Offline support: cache the app so it opens without an internet connection
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch((err) => console.warn('Service worker registration failed', err));
      });
    }
  </script>
<script src="/reminders.js"></script>
</body>
</html>
